<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator P5</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#f5f5f5;
            font-family:'Poppins', sans-serif;
            display:flex;
            justify-content:center;
            padding:30px;
        }

        .container{
            width:760px;
            background:#f7f7f7;
            border-radius:20px;
            padding:35px;
            box-shadow:0 0 10px rgba(0,0,0,0.05);
        }

        .label{
            display:inline-block;
            background:#f2e2b9;
            color:#8a5400;
            padding:10px 18px;
            border-radius:30px;
            font-weight:600;
            margin-bottom:25px;
        }

        h1{
            font-family:'Cormorant Garamond', serif;
            font-size:58px;
            font-weight:400;
            color:#16233a;
            margin-bottom:25px;
        }

        .rumus-box{
            border:1px solid #bfd1ff;
            border-radius:25px;
            padding:45px;
            text-align:center;
            margin-bottom:35px;
        }

        .rumus{
            font-family:'Cormorant Garamond', serif;
            font-size:34px;
            color:#1b2230;
        }

        .input-group{
            display:flex;
            gap:20px;
            margin-bottom:20px;
        }

        .input-box{
            flex:1;
        }

        .input-box label{
            display:block;
            font-size:16px;
            font-weight:600;
            color:#36445a;
            margin-bottom:10px;
        }

        input{
            width:100%;
            padding:16px;
            border-radius:18px;
            border:1px solid #d8c5a1;
            outline:none;
            font-size:16px;
            background:white;
        }

        button{
            background:#2f63ea;
            color:white;
            border:none;
            padding:16px 28px;
            border-radius:20px;
            font-size:18px;
            font-weight:600;
            cursor:pointer;
            margin-bottom:25px;
            transition:0.3s;
        }

        button:hover{
            background:#1f4fd1;
        }

        .hasil{
            background:#dff1e8;
            border:1px solid #9ee5d2;
            border-radius:25px;
            padding:50px 30px;
            text-align:center;
        }

        .hasil p{
            font-family:'Cormorant Garamond', serif;
            font-size:30px;
            color:#005844;
            margin:40px 0;
            font-weight:600;
        }

        @media(max-width:700px){
            .input-group{
                flex-direction:column;
            }

            h1{
                font-size:42px;
            }

            .rumus{
                font-size:28px;
            }

            .hasil p{
                font-size:24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="label">Kalkulator P5</div>

        <h1>Operasi himpunan</h1>

        <div class="rumus-box">
            <div class="rumus">
                A ∪ B,&nbsp;&nbsp;&nbsp;
                A ∩ B,&nbsp;&nbsp;&nbsp;
                A − B
            </div>
        </div>

        <div class="input-group">

            <div class="input-box">
                <label>A</label>
                <input type="text" id="setA" placeholder="Ayu,Budi,Citra,Dian">
            </div>

            <div class="input-box">
                <label>B</label>
                <input type="text" id="setB" placeholder="Budi,Dian,Eka">
            </div>

        </div>

        <button onclick="hitung()">Hitung</button>

        <div class="hasil" id="hasil">

            <p id="union">
                A ∪ B = {Ayu, Budi, Citra, Dian, Eka}
            </p>

            <p id="irisan">
                A ∩ B = {Budi, Dian}
            </p>

            <p id="selisih">
                A − B = {Ayu, Citra}
            </p>

        </div>

    </div>

    <script>
        function hitung(){

            let A = document.getElementById("setA").value
                .split(",")
                .map(item => item.trim())
                .filter(item => item !== "");

            let B = document.getElementById("setB").value
                .split(",")
                .map(item => item.trim())
                .filter(item => item !== "");

            // UNION
            let union = [...new Set([...A, ...B])];

            // IRISAN
            let irisan = A.filter(item => B.includes(item));

            // SELISIH
            let selisih = A.filter(item => !B.includes(item));

            document.getElementById("union").innerHTML =
                `A ∪ B = {${union.join(", ")}}`;

            document.getElementById("irisan").innerHTML =
                `A ∩ B = {${irisan.join(", ")}}`;

            document.getElementById("selisih").innerHTML =
                `A − B = {${selisih.join(", ")}}`;
        }
    </script>

</body>
</html>
