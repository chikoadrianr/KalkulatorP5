<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator Operasi Himpunan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f4f4f4;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#1f2937;
}

.input-area{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.input-group{
    flex:1;
    min-width:250px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
}

button{
    margin-top:15px;
    padding:12px 25px;
    border:none;
    background:#2563eb;
    color:white;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

.result{
    margin-top:25px;
    background:#eafaf1;
    padding:20px;
    border-radius:15px;
}

.result p{
    margin:10px 0;
    font-size:18px;
}

#venn{
    width:100%;
    height:500px;
    border:3px solid #7c3aed;
    margin-top:20px;
    border-radius:10px;
    background:white;
}
</style>
</head>

<body>

<div class="container">

<h1>Kalkulator Operasi Himpunan</h1>

<div class="input-area">

<div class="input-group">
<label>Himpunan A</label>
<input type="text" id="setA" placeholder="Contoh: 1,2,3,4">
</div>

<div class="input-group">
<label>Himpunan B</label>
<input type="text" id="setB" placeholder="Contoh: 3,4,5,6">
</div>

</div>

<button onclick="hitung()">Hitung</button>

<div class="result">

<p id="union">A ∪ B = { }</p>
<p id="intersect">A ∩ B = { }</p>
<p id="difference">A − B = { }</p>

<svg id="venn"></svg>

</div>

</div>

<script>

function hitung(){

let A = document.getElementById("setA").value
.split(",")
.map(x=>x.trim())
.filter(x=>x!="");

let B = document.getElementById("setB").value
.split(",")
.map(x=>x.trim())
.filter(x=>x!="");

A=[...new Set(A)];
B=[...new Set(B)];

let union=[...new Set([...A,...B])];
let irisan=A.filter(x=>B.includes(x));
let hanyaA=A.filter(x=>!B.includes(x));
let hanyaB=B.filter(x=>!A.includes(x));

document.getElementById("union").innerHTML =
"<b>A ∪ B</b> = { "+union.join(", ")+" }";

document.getElementById("intersect").innerHTML =
"<b>A ∩ B</b> = { "+irisan.join(", ")+" }";

document.getElementById("difference").innerHTML =
"<b>A − B</b> = { "+hanyaA.join(", ")+" }";

gambarVenn(hanyaA,irisan,hanyaB);

}

function gambarVenn(kiri,tengah,kanan){

const svg=document.getElementById("venn");

const jumlahA=kiri.length+tengah.length;
const jumlahB=kanan.length+tengah.length;

/* ukuran awal diperbesar sedikit */
const radiusA=Math.max(115,jumlahA*18);
const radiusB=Math.max(115,jumlahB*18);

const cxA=320;
const cxB=320+Math.min(radiusA,radiusB);

svg.innerHTML=`

<text x="20" y="30"
font-size="28"
font-weight="bold"
fill="#7c3aed">S</text>

<circle
cx="${cxA}"
cy="230"
r="${radiusA}"
fill="rgba(255,0,0,0.10)"
stroke="red"
stroke-width="3"/>

<circle
cx="${cxB}"
cy="230"
r="${radiusB}"
fill="rgba(0,0,255,0.10)"
stroke="#0066ff"
stroke-width="3"/>

<text
x="${cxA}"
y="${230-radiusA-20}"
font-size="28"
font-weight="bold"
fill="red"
text-anchor="middle">
A
</text>

<text
x="${cxB}"
y="${230-radiusB-20}"
font-size="28"
font-weight="bold"
fill="#0066ff"
text-anchor="middle">
B
</text>
`;

kiri.forEach((item,index)=>{

let t=document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

t.setAttribute("x",cxA-radiusA/3);
t.setAttribute("y",200+(index*30));
t.setAttribute("font-size","22");
t.setAttribute("text-anchor","middle");

t.textContent=item;
svg.appendChild(t);

});

tengah.forEach((item,index)=>{

let t=document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

t.setAttribute("x",(cxA+cxB)/2);
t.setAttribute("y",200+(index*30));
t.setAttribute("font-size","22");
t.setAttribute("text-anchor","middle");

t.textContent=item;
svg.appendChild(t);

});

kanan.forEach((item,index)=>{

let t=document.createElementNS(
"http://www.w3.org/2000/svg",
"text"
);

t.setAttribute("x",cxB+radiusB/3);
t.setAttribute("y",200+(index*30));
t.setAttribute("font-size","22");
t.setAttribute("text-anchor","middle");

t.textContent=item;
svg.appendChild(t);

});

}

gambarVenn([],[],[]);

</script>

</body>
</html>
